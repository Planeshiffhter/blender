name: Check A Second Taj
on:
  push:
    paths:
      - 'CartoonStudio/episodes/a_second_taj/**'
      - '.github/workflows/a-second-taj.yml'
  pull_request:
    paths:
      - 'CartoonStudio/episodes/a_second_taj/**'
      - '.github/workflows/a-second-taj.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: taj-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: CartoonStudio/episodes/a_second_taj
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check scripts, dialogue and packed assets
        run: |
          python -m compileall -q .
          python verify_handoff.py
      - name: Check both published movies
        run: |
          command -v ffprobe || (sudo apt-get update -qq && sudo apt-get install -y ffmpeg)
          python - <<'PY'
          import json
          import subprocess

          for name, seconds in [("A_Second_Taj.mp4", 20), ("A_Second_Taj_40s.mp4", 40)]:
              path = f"final/{name}"
              data = json.loads(subprocess.check_output([
                  "ffprobe", "-v", "error", "-show_streams", "-of", "json", path,
              ]))
              for kind in ("video", "audio"):
                  streams = [s for s in data["streams"] if s["codec_type"] == kind]
                  if not streams or abs(float(streams[0]["duration"]) - seconds) > 0.15:
                      raise SystemExit(f"{path}: expected a {seconds}-second {kind} stream")
              print(f"{path}: verified {seconds}-second video and audio streams")
          PY
