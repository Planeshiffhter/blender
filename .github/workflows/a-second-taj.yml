name: Check A Second Taj
on:
  push:
    paths:
      - 'CartoonStudio/episodes/a_second_taj/**'
      - '.github/workflows/a-second-taj.yml'
  pull_request:
    paths:
      - 'CartoonStudio/episodes/a_second_taj/**'
      - '.github/workflows/a-second-taj.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: taj-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: CartoonStudio/episodes/a_second_taj
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check scripts, dialogue and packed assets
        run: |
          python -m compileall -q .
          python verify_handoff.py
      - name: Verify original film, dialogue sync and captions
        run: |
          command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y ffmpeg)
          python verify_export.py "$RUNNER_TEMP/taj-review"
      - name: Upload camera frames, speaker list and captions for review
        uses: actions/upload-artifact@v4
        with:
          name: original-taj-camera-review
          path: ${{ runner.temp }}/taj-review/
          if-no-files-found: error
          retention-days: 7
